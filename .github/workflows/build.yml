name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.kt"
      - "AndroidManifest.xml"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          sudo mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" | sudo tee "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" | sudo tee "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create Android project from the repo files
        run: |
          mkdir -p app/src/main/java/com/shivam/autoanswer
          cp MainActivity.kt CallReceiver.kt app/src/main/java/com/shivam/autoanswer/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          sed -i 's#@mipmap/ic_launcher#@android:drawable/sym_def_app_icon#; s#@style/Theme.AppCompat.DayNight.DarkActionBar#@android:style/Theme.Material.Light.DarkActionBar#' app/src/main/AndroidManifest.xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoAnswer"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.shivam.autoanswer'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.shivam.autoanswer'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          echo "org.gradle.jvmargs=-Xmx2g" > gradle.properties

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AutoAnswer-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Auto Answer APK #${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
